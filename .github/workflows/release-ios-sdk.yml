name: Release iOS SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to publish, for example v1.8.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ios-sdk-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PACKAGE_REPOSITORY: linreal/cascade-editor-ios
      PACKAGE_REPO_TOKEN: ${{ secrets.CASCADE_EDITOR_IOS_RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the immutable source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select the runner's Java 17
        shell: bash
        run: |
          set -euo pipefail
          java_home="${JAVA_HOME_17_arm64:?The macOS arm64 runner must provide Java 17}"
          "$java_home/bin/java" -version
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify tag and configured version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH."
            exit 1
          }
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "Tag $RELEASE_TAG does not match VERSION_NAME=$version."
            exit 1
          }
          [[ "$(git describe --tags --exact-match HEAD)" == "$RELEASE_TAG" ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify package repository credentials and readiness
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CASCADE_EDITOR_IOS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PACKAGE_REPO_TOKEN" ]] || {
            echo "Configure the CASCADE_EDITOR_IOS_RELEASE_TOKEN repository secret."
            exit 1
          }
          can_push="$(
            gh api "repos/$PACKAGE_REPOSITORY" --jq '.permissions.push // false'
          )"
          [[ "$can_push" == "true" ]] || {
            echo "CASCADE_EDITOR_IOS_RELEASE_TOKEN cannot push to $PACKAGE_REPOSITORY."
            exit 1
          }
          gh api "repos/$PACKAGE_REPOSITORY/branches/main" >/dev/null 2>&1 || {
            echo "$PACKAGE_REPOSITORY must be initialized with a main branch before release."
            echo "Create the repository with an initial README, then dispatch this workflow again."
            exit 1
          }

      - name: Prepare the tagged Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew --version; then
            exit 0
          fi

          # If the distribution redirect fails, fetch the same ZIP via the
          # GitHub release asset API and seed the wrapper's existing cache.
          version="$(sed -nE 's|^distributionUrl=.*gradle-([0-9.]+)-bin\.zip$|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          archive="gradle-$version-bin.zip"
          locks=("${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/${archive%.zip}"/*/"$archive.lck")
          if [[ "${#locks[@]}" -ne 1 || ! -f "${locks[0]}" ]]; then
            echo "Could not identify the wrapper cache for $archive." >&2
            exit 1
          fi

          download_dir="$(mktemp -d "$RUNNER_TEMP/gradle-wrapper.XXXXXX")"
          trap 'rm -rf "$download_dir"' EXIT
          gh release download "v$version" --repo gradle/gradle-distributions \
            --pattern "$archive" --dir "$download_dir"
          checksum="$(curl --fail --silent --show-error --location --retry 3 \
            "https://downloads.gradle.org/distributions/$archive.sha256")"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$checksum" "$download_dir/$archive" | shasum -a 256 -c -
          mv "$download_dir/$archive" "${locks[0]%.lck}"
          ./gradlew --version

      - name: Boot iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          [[ -n "$simulator_udid" && "$simulator_udid" != "null" ]]
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "CASCADE_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      # workflow_dispatch evaluates this workflow from main, then checks out the
      # immutable source tag. Keep the memory guard here as well as in the
      # packaging script so an existing tag can be retried safely.
      - name: Prebuild native binaries within runner memory
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=1 \
            :editor-ios-sdk:allTests \
            :editor-ios-sdk:apiCheck
          ./gradlew --max-workers=1 \
            :editor-ios-sdk:assembleCascadeEditorReleaseXCFramework

      - name: Build the publication artifact
        run: scripts/package-ios-sdk.sh "$RELEASE_VERSION"

      - name: Validate in a clean SwiftPM consumer
        run: |
          scripts/validate-ios-consumer.sh \
            "build/ios-release/$RELEASE_VERSION/CascadeEditor.xcframework.zip"

      - name: Detect workflow evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          artifact="build/ios-release/${RELEASE_VERSION:-}/CascadeEditor.xcframework.zip"
          if [[ -f "$artifact" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No publication artifact exists because an earlier release gate failed."
          fi

      - name: Upload workflow evidence
        if: ${{ always() && steps.evidence.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CascadeEditor-iOS-${{ env.RELEASE_VERSION }}
          path: |
            build/ios-release/${{ env.RELEASE_VERSION }}/CascadeEditor.xcframework.zip
            build/ios-release/${{ env.RELEASE_VERSION }}/CascadeEditor.xcframework.zip.sha256
            build/ios-release/${{ env.RELEASE_VERSION }}/swift-package/
            build/ios-consumer-smoke/*.xcresult
            build/ios-consumer-smoke/test-summary.txt
            build/ios-consumer-smoke/attachments/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish immutable GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite immutable assets."
            exit 1
          fi
          release_root="build/ios-release/$RELEASE_VERSION"
          gh release create "$RELEASE_TAG" \
            "$release_root/CascadeEditor.xcframework.zip" \
            "$release_root/CascadeEditor.xcframework.zip.sha256" \
            --verify-tag \
            --title "CascadeEditor $RELEASE_VERSION" \
            --generate-notes

      - name: Verify the public binary target URL and checksum
        shell: bash
        run: |
          set -euo pipefail
          package_root="build/ios-release/$RELEASE_VERSION/swift-package"
          (
            cd "$package_root"
            swift package reset
            swift package resolve
          )

      - name: Check out Swift package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PACKAGE_REPOSITORY }}
          ref: main
          token: ${{ secrets.CASCADE_EDITOR_IOS_RELEASE_TOKEN }}
          path: package-repository
          fetch-depth: 0

      - name: Publish Swift package manifest
        shell: bash
        run: |
          set -euo pipefail
          if git -C package-repository rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Swift package tag $RELEASE_VERSION already exists."
            exit 1
          fi

          generated_package="build/ios-release/$RELEASE_VERSION/swift-package"
          ditto "$generated_package/Package.swift" package-repository/Package.swift
          ditto "$generated_package/README.md" package-repository/README.md
          ditto "$generated_package/LICENSE" package-repository/LICENSE
          mkdir -p package-repository/THIRD_PARTY_NOTICES
          rsync -a --delete \
            "$generated_package/THIRD_PARTY_NOTICES/" \
            package-repository/THIRD_PARTY_NOTICES/

          git -C package-repository config user.name "github-actions[bot]"
          git -C package-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C package-repository add --all
          git -C package-repository diff --cached --quiet && {
            echo "Swift package repository did not change."
            exit 1
          }
          git -C package-repository commit -m "Release $RELEASE_VERSION"
          git -C package-repository tag -a "$RELEASE_VERSION" -m "CascadeEditor $RELEASE_VERSION"
          git -C package-repository push origin HEAD:main
          git -C package-repository push origin "$RELEASE_VERSION"
