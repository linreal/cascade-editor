name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 standard runners are Apple Silicon. The published SDK supports
    # arm64 devices and arm64 simulators, so this keeps CI on the consumer ABI.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Boot iOS simulator
        shell: bash
        run: |
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          if [[ -z "$simulator_udid" || "$simulator_udid" == "null" ]]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "CASCADE_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Check editor
        run: |
          ./gradlew \
            :editor:assemble \
            :editor:allTests \
            :editor:apiCheck

      - name: Package native iOS SDK
        run: |
          scripts/package-ios-sdk.sh

      - name: Validate packaged SDK in a clean iOS app
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          scripts/validate-ios-consumer.sh \
            "build/ios-release/$version/CascadeEditor.xcframework.zip"

      - name: Upload iOS smoke-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-consumer-smoke
          path: |
            build/ios-consumer-smoke/*.xcresult
            build/ios-consumer-smoke/test-summary.txt
            build/ios-consumer-smoke/attachments/
          if-no-files-found: warn
          retention-days: 14
