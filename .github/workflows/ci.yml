name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 standard runners are Apple Silicon. The published SDK supports
    # arm64 devices and arm64 simulators, so this keeps CI on the consumer ABI.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Boot iOS simulator
        shell: bash
        run: |
          simulator="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0] | [.udid, .state] | @tsv'
          )"
          IFS=$'\t' read -r simulator_udid simulator_state <<< "$simulator"
          if [[ -z "$simulator_udid" || "$simulator_udid" == "null" ]]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          if [[ "$simulator_state" != "Booted" ]]; then
            xcrun simctl boot "$simulator_udid"
          fi
          xcrun simctl bootstatus "$simulator_udid" --block
          echo "CASCADE_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Check editor
        run: |
          ./gradlew \
            :editor:assembleDebug \
            :editor:allTests \
            :editor:apiCheck

      - name: Package native iOS SDK
        run: |
          scripts/package-ios-sdk.sh

      - name: Validate packaged SDK in a clean iOS app
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          scripts/validate-ios-consumer.sh \
            "build/ios-release/$version/CascadeEditor.xcframework.zip"

      - name: Upload iOS smoke-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-consumer-smoke
          path: |
            build/ios-consumer-smoke/*.xcresult
            build/ios-consumer-smoke/test-summary.txt
            build/ios-consumer-smoke/attachments/
          if-no-files-found: warn
          retention-days: 14
